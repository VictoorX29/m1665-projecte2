<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projecte d'Encuesta del aula</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="page-header">
    <h1>Projecte d'Encuesta del aula</h1>
  </header>

  <main class="layout">
    <section class="card card--form">
      <h2>Formulari d'enquesta</h2>

      <div class="field">
        <label for="grup">Grup</label>
        <select id="grup" name="grup">
          <option value="DAW1A">DAW1A</option>
          <option value="DAW1B">DAW1B</option>
          <option value="ASIX1">ASIX1</option>
        </select>
      </div>

      <div class="field">
        <label for="puntuacio">Satisfacció global 1-5</label>
        <input type="number" id="puntuacio" name="puntuacio" min="1" max="5" value="4">
      </div>

      <div class="field">
        <label for="comentari">Comentari opcional</label>
        <textarea id="comentari" name="comentari" placeholder="Què milloraries de la sessió?"></textarea>
      </div>

      <p id="error-form" class="error" hidden></p>

      <button type="button" id="btn-guardar" class="btn-primary">Guardar resposta</button>
    </section>

    <section class="card card--panel">
      <h2>Panell d'analítica</h2>
      <p id="hint-grup" class="hint-grup">Grup del formulari: DAW1A</p>
      <p class="panell-resum">
        Respostes guardades: <strong id="kpi-respostes">0</strong>
      </p>
      <h3>Últimes respostes</h3>
      <div id="llista-respostes" class="llista-respostes"></div>
    </section>
  </main>

  <template id="tpl-resposta">
    <article class="resposta-card">
      <span class="badge-grup"></span>
      <p class="resposta-puntuacio"></p>
      <p class="resposta-comentari"></p>
    </article>
  </template>

  <script src="js/app.js"></script>
  <script src="js/formulari.js"></script>
  <script src="js/panell.js"></script>
</body>
</html>
